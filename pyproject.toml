[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eve-diagnostic-booking"
version = "1.0.0"
description = "Diagnostic test booking & simulated payment backend for EVE Healthcare"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "email-validator>=2.2,<3.0",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "argon2-cffi>=23.1,<26.0",
    "pyjwt>=2.9,<3.0",
    "python-multipart>=0.0.9",
    "redis>=5.0,<7.0",
    "celery>=5.4,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0",
    "httpx>=0.27,<1.0",
    "fakeredis>=2.23,<3.0",
    "ruff>=0.6",
    "black>=24.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "N"]
ignore = ["B008"]  # FastAPI's Depends()/Query() in argument defaults is the idiomatic pattern

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["concurrency: tests that run real concurrent database transactions"]

[tool.coverage.run]
source = ["app"]
omit = ["app/scripts/*"]
